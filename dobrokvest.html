<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ДоброКвест · волонтерство у Дніпрі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#05eb40; --gd:#03a52d; --gsoft:#e8fff0;
  --p:#8144fa; --pd:#6a2fe0; --psoft:#f4efff;
  --ink:#17142b; --mut:#65617c; --line:#e9e5f5; --bg:#ffffff;
  --r:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:30}
h1,h2,h3{font-family:'Unbounded','Onest',system-ui,sans-serif;line-height:1.2;margin:0;letter-spacing:-.01em}
h3{font-family:'Onest',system-ui,sans-serif;font-weight:700;font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--p);outline-offset:2px;border-radius:8px}
.mut{color:var(--mut)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}


.hdr{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;z-index:20;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.05rem}
.logo{width:34px;height:34px;border-radius:11px;background:var(--p);position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--g);border:3px solid #fff}
.sp{flex:1}
.chip-btn{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.85rem;font-weight:600;background:#fff}
.chip-btn:hover{border-color:var(--p);color:var(--p)}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.me .lv{background:var(--g);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem}


.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:25}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:.74rem;font-weight:600;color:var(--mut)}
.nav button span{font-size:1.25rem;line-height:1}
.nav button[aria-current="page"]{color:var(--p);background:var(--psoft)}
main{padding:20px 0 120px}
@media(min-width:860px){
  .nav{position:static;border:0;padding:0;background:none;justify-content:flex-start;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:8px;padding:9px 14px;font-size:.92rem}
  .nav button span{font-size:1.05rem}
  .hdr .hrow{height:66px}
  main{padding-bottom:60px}
}


.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;transition:background .15s,transform .1s}
.btn:hover{background:var(--pd)}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--g);color:var(--ink)}
.btn.g:hover{background:#00d438}
.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.o:hover{background:var(--psoft)}
.btn.w{width:100%}
.btn[disabled]{background:#eeebf6;color:#9893ad;cursor:not-allowed}
.bar{height:12px;border-radius:999px;background:var(--psoft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--psoft);color:var(--pd)}
.tag.t2{background:#f3f2f7;color:var(--mut)}
.tag.ok{background:var(--g);color:var(--ink)}
.tag.go{background:#fff3c9;color:#7a5600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-h h2{font-size:1.15rem}
.empty{text-align:center;padding:36px 18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--mut)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}


.hero{border-radius:24px;padding:24px 20px;background:var(--psoft);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--g);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(1.45rem,5vw,2.2rem);max-width:15em}
.hero p{margin-top:10px;max-width:34em;color:var(--mut)}
.hero .lvbox{margin-top:18px;background:#fff;border-radius:16px;padding:14px;max-width:420px}
.lvrow{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem;margin-bottom:8px}


.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:.88rem;background:#fff}
.fb[aria-pressed="true"]{background:var(--p);border-color:var(--p);color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;margin-bottom:10px}
.search:focus{border-color:var(--p);outline:none}
.q{display:flex;gap:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.q:hover{border-color:var(--p)}
.qi{width:52px;height:52px;border-radius:16px;background:var(--psoft);display:grid;place-items:center;font-size:1.6rem;flex:none}
.qb{min-width:0;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.q h3{margin-bottom:2px}
.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.88rem;color:var(--mut);font-weight:500}
.rw{background:var(--gsoft);color:#056a1f;padding:1px 9px;border-radius:999px;font-weight:700}


.bal{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--p);color:#fff;border-radius:22px;padding:20px}
.bal b{font-family:'Unbounded',sans-serif;font-size:2rem;color:var(--g)}
.rcard{display:flex;flex-direction:column;gap:10px}
.rtop{display:flex;gap:12px;align-items:center}
.ri{width:48px;height:48px;border-radius:14px;background:var(--gsoft);display:grid;place-items:center;font-size:1.5rem}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:var(--psoft);color:var(--pd);padding:6px 12px;border-radius:10px;display:inline-block}


.prof{display:flex;gap:16px;align-items:center}
.ava{width:68px;height:68px;border-radius:22px;background:var(--p);color:#fff;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:1.7rem;flex:none;box-shadow:6px 6px 0 var(--g)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--psoft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Unbounded',sans-serif;font-size:1.3rem}
.stat span{font-size:.8rem;color:var(--mut)}
.ach{display:flex;gap:12px;align-items:center}
.ach .ai{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:1.3rem;flex:none}
.ach.lock{opacity:.45}
.ach.lock .ai{background:#eceaf3;filter:grayscale(1)}
.lb{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .n{width:26px;font-weight:700;color:var(--mut)}
.lb.you{background:var(--gsoft);border-radius:12px;padding:10px 10px;border:0}
.lb .sp{font-weight:600}


label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input.f,select.f,textarea.f{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;background:#fff}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--p);outline:none}
textarea.f{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}


.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;padding:30px 18px 50px}
.login h1{font-size:clamp(1.7rem,6vw,2.4rem);margin:18px 0 10px}
.roles{display:grid;gap:12px;margin-top:20px}
.role{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:#fff;width:100%;transition:border-color .15s,background .15s}
.role:hover{border-color:var(--p);background:var(--psoft)}
.role .ri{background:var(--psoft)}
.role b{display:block}
.principle{margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--gsoft);color:#055a1b;font-weight:500;font-size:.95rem}


.ov{position:fixed;inset:0;background:rgba(23,20,43,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
.sheet h2{font-size:1.25rem;margin:8px 0}
.xbtn{float:right;width:36px;height:36px;border-radius:50%;background:#f3f2f7;font-size:1.1rem}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin:4px 0}
.res{text-align:center}
.res .big{font-family:'Unbounded',sans-serif;font-size:2.4rem;color:var(--p)}
.res .big span{background:var(--g);color:var(--ink);padding:0 10px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:90vw;animation:fade .2s}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
.foot{margin-top:34px;font-size:.82rem;color:var(--mut);text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var KEY='dobrokvest.v1';
var LV=['Новачок','Помічник','Активіст','Герой міста','Легенда Дніпра'];
var CATS={
  animals:{n:'Тварини',e:'🐾'},
  eco:{n:'Екологія',e:'🌳'},
  aid:{n:'Гумдопомога',e:'📦'},
  city:{n:'Місто',e:'🗺️'}
};
var QUESTS=[
 {id:1,title:'Вигуляти собаку з притулку',cat:'animals',org:'Притулок «Лапа допомоги»',district:'Самарський район',hours:2,xp:40,pts:30,slots:6,joined:3,lvl:'Легко',
  desc:'Притулку бракує рук, щоб кожен собака щодня виходив на прогулянку. Ви берете одного пса на повідку й гуляєте з ним близько двох годин.',
  steps:['Прийдіть до притулку й отримайте собаку та повідок','Вигуляйте його у вказаній зоні','Поверніть собаку й повідомте волонтерам, як усе минуло']},
 {id:2,title:'Прибрати парк',cat:'eco',org:'Ініціативна група «Чисте Придніпров’я»',district:'Центр',hours:3,xp:60,pts:50,slots:20,joined:11,lvl:'Середньо',
  desc:'Спільне прибирання алей і газонів. Рукавички та мішки на місці, потрібен лише зручний одяг.',
  steps:['Зустріч на вході в парк','Отримайте рукавички та мішки','Прибирайте свою ділянку','Здайте повні мішки координатору']},
 {id:3,title:'Розвантажити фуру з гумдопомогою',cat:'aid',org:'Благодійний фонд «Спільна справа»',district:'Індустріальний район',hours:2,xp:80,pts:70,slots:10,joined:7,lvl:'Складно',
  desc:'Прийшла фура з допомогою: треба швидко розвантажити коробки й розкласти їх на складі. Потрібна фізична витривалість.',
  steps:['Прийдіть на склад фонду','Розвантажте фуру в команді','Розкладіть коробки за списком','Підпишіть акт приймання з координатором']},
 {id:4,title:'Дослідити місцевість Дніпра',cat:'city',org:'Краєзнавчий клуб «Дніпрова хвиля»',district:'Соборний район',hours:2,xp:50,pts:40,slots:15,joined:4,lvl:'Легко',
  desc:'Пройдіть маршрутом по місту, сфотографуйте цікаві місця й додайте короткі описи. Матеріали підуть у відкриту мапу міської історії.',
  steps:['Отримайте маршрут і список точок','Зробіть фото кожної точки','Напишіть коротку примітку до кожного фото','Надішліть добірку координатору']},
 {id:5,title:'Пакування продуктових наборів',cat:'aid',org:'Благодійний фонд «Спільна справа»',district:'Шевченківський район',hours:3,xp:55,pts:45,slots:12,joined:5,lvl:'Легко',
  desc:'Збираємо набори для літніх людей: крупи, консерви, олія. Працюємо за конвеєром, вистачить будь-якого темпу.',
  steps:['Прийдіть на пункт пакування','Станьте до свого етапу конвеєра','Перевірте комплектність наборів']},
 {id:6,title:'Висадити дерева на набережній',cat:'eco',org:'Ініціативна група «Чисте Придніпров’я»',district:'Амур-Нижньодніпровський район',hours:4,xp:75,pts:65,slots:25,joined:9,lvl:'Середньо',
  desc:'Висаджуємо саджанці вздовж набережної. Лопати видаємо на місці, інструктор покаже, як правильно садити.',
  steps:['Інструктаж на місці','Посадіть своє дерево','Полийте й підпишіть табличку']},
 {id:7,title:'Нагодувати безпритульних котів',cat:'animals',org:'Притулок «Лапа допомоги»',district:'Новокодацький район',hours:1,xp:25,pts:20,slots:8,joined:2,lvl:'Легко',
  desc:'Короткий обхід з кормом за списком точок у дворах. Для тих, хто має лише годину.',
  steps:['Заберіть корм і маршрут','Обійдіть точки зі списку','Позначте, де кіт не прийшов']},
 {id:8,title:'Читання дітям у бібліотеці',cat:'city',org:'Краєзнавчий клуб «Дніпрова хвиля»',district:'Чечелівський район',hours:2,xp:45,pts:35,slots:6,joined:1,lvl:'Середньо',
  desc:'Читаємо вголос казки для дітей з прифронтових родин, які переїхали до міста. Книжки підготовлені.',
  steps:['Оберіть книжку з добірки','Прочитайте її групі дітей','Проведіть коротке обговорення']}
];
var REWARDS=[
 {id:'r1',e:'☕',name:'Кава в подарунок',partner:'Кав’ярня «Зерно»',cost:40},
 {id:'r2',e:'🛍️',name:'Знижка 10% на покупку',partner:'Магазин «Крамничка»',cost:60},
 {id:'r3',e:'🎬',name:'Знижка 30% на квиток',partner:'Кінотеатр «Екран»',cost:90},
 {id:'r4',e:'🏋️',name:'Разове відвідування',partner:'Спортзал «Пульс»',cost:120}
];
var ACH=[
 {id:'a1',e:'🌱',n:'Перший крок',d:'Виконайте перший квест',t:function(){return S.done.length>=1}},
 {id:'a2',e:'🔥',n:'Тріо добрих справ',d:'Виконайте 3 квести',t:function(){return S.done.length>=3}},
 {id:'a3',e:'🐕',n:'Друг тварин',d:'Квест у категорії «Тварини»',t:function(){return hasCat('animals')}},
 {id:'a4',e:'🌍',n:'Чисте місто',d:'Квест у категорії «Екологія»',t:function(){return hasCat('eco')}},
 {id:'a5',e:'🤝',n:'Рука допомоги',d:'Квест у категорії «Гумдопомога»',t:function(){return hasCat('aid')}},
 {id:'a6',e:'⭐',n:'Активіст',d:'Досягніть 3 рівня',t:function(){return lvl(S.xp)>=3}},
 {id:'a7',e:'🎁',n:'Нагорода отримана',d:'Обміняйте бали на бонус',t:function(){return S.redeemed.length>=1}}
];
var BOARD=[{n:'Олена К.',xp:420},{n:'Максим Р.',xp:310},{n:'Дарина П.',xp:255},{n:'Артем Л.',xp:190}];

function fresh(){return{user:null,xp:0,points:0,taken:[],done:[],redeemed:[],custom:[],
  pending:[{id:2,who:'Олена К.',ok:false},{id:1,who:'Максим Р.',ok:false}],view:'quests',filter:'all',q:''}}
function load(){try{var s=localStorage.getItem(KEY);if(s){return Object.assign(fresh(),JSON.parse(s))}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();
var modal=null;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lvl(xp){return Math.floor(xp/100)+1}
function lvName(l){return LV[Math.min(l-1,LV.length-1)]}
function all(){return QUESTS.concat(S.custom)}
function byId(id){return all().filter(function(q){return String(q.id)===String(id)})[0]}
function isDone(id){return S.done.some(function(d){return String(d.id)===String(id)})}
function isTaken(id){return S.taken.some(function(t){return String(t)===String(id)})}
function hasCat(c){return S.done.some(function(d){var q=byId(d.id);return q&&q.cat===c})}
function unlocked(){return ACH.filter(function(a){return a.t()}).map(function(a){return a.id})}
function toast(m){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function burst(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['#05eb40','#8144fa','#05eb40','#b99aff'];
  for(var i=0;i<42;i++){var c=document.createElement('i');c.className='conf';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDelay=Math.random()*.5+'s';c.style.animationDuration=(1.4+Math.random()*1.2)+'s';
    document.body.appendChild(c);setTimeout(function(el){return function(){el.remove()}}(c),3200)}
}


function loginView(){
  return '<div class="login">'+
   '<div class="brand"><span class="logo"></span>ДоброКвест</div>'+

function render(){
  var y=window.scrollY;var app=document.getElementById('app');
  if(!S.user){app.innerHTML=loginView();return}
  var v=S.view,body='';
  if(S.user.role==='vol'){body=v==='mine'?mineView():v==='rewards'?rewardsView():v==='profile'?profileView():questsView()}
  else{body=v==='ocreate'?ocreateView():v==='oconfirm'?oconfirmView():oquestsView()}
  app.innerHTML=header()+'<main><div class="wrap">'+body+(S.user.role==='vol'&&v==='quests'?'<p class="foot">Організації, квести та партнери в цій версії — демонстраційні дані.</p>':'')+'</div></main>'+modalHtml();
  window.scrollTo(0,y);
}

 login:function(d){var nm=(document.getElementById('nm').value||'').trim();

   save();modal={t:'result',id:q.id,up:lvl(S.xp)>before,ach:na};render();burst()},
 toRewards:function(){modal=null;go('rewards')},
 redeem:function(d){var r=REWARDS.filter(function(x){return x.id===d.id})[0];if(!r||S.points<r.cost)return;
   S.points-=r.cost;var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='';
   for(var i=0;i<8;i++){c+=ch.charAt(Math.floor(Math.random()*ch.length));if(i===3)c+='-'}
   c='DK-'+c;S.redeemed.push({rid:r.id,code:c});save();modal={t:'code',rid:r.id,code:c};render()},
 create:function(){
   var g=function(i){return document.getElementById(i).value};
   var title=g('c-title').trim();
   if(title.length<4){toast('Додайте назву квесту (мінімум 4 символи)');document.getElementById('c-title').focus();return}
   var cat=g('c-cat'),xp=Math.max(10,Math.min(200,parseInt(g('c-xp'),10)||50));
   var desc=g('c-d').trim()||'Деталі уточнюйте в організатора.';
   S.custom.push({id:'c'+Date.now(),title:title,cat:cat,org:S.user.name,district:g('c-dist'),hours:Math.max(1,Math.min(8,parseInt(g('c-h'),10)||2)),
     xp:xp,pts:Math.round(xp*.8),slots:Math.max(1,Math.min(100,parseInt(g('c-s'),10)||10)),joined:0,lvl:g('c-lvl'),desc:desc,
     steps:['Прийдіть у вказане місце','Виконайте завдання разом із координатором','Отримайте підтвердження від організатора']});
   save();S.view='oquests';render();window.scrollTo(0,0);toast('Квест опубліковано. Волонтери його вже бачать');},
 confirm:function(d){
   if(d.di!==''&&d.di!==undefined){var x=S.done[parseInt(d.di,10)];if(x)x.ok=true}
   else{var p=S.pending[parseInt(d.i,10)];if(p)p.ok=true}
   save();render();toast('Виконання підтверджено')},
 reset:function(){if(confirm('Скинути прогрес і повернутися на екран входу?')){S=fresh();modal=null;save();render();window.scrollTo(0,0)}}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var f=A[t.dataset.a];if(f){if(t.dataset.a==='closeBg'&&e.target!==t)return;f(t.dataset,e)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modal){modal=null;render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article[data-a="open"]')){e.preventDefault();A.open(e.target.dataset)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='srch'){S.q=e.target.value;var l=document.getElementById('list');if(l)l.innerHTML=listHtml()}
});
render();
})();
</script>
</body>
</html>
